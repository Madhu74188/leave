
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Leave Management System</h1>

    <!-- Registration -->
    <section id="registration-section" class="card" style="display:none">
        <h2>Create User</h2>

        <form id="registration-form">
            <label for="username">Username</label>
            <input type="text" id="username" required>

            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" required>

            <label for="roll-number">Roll Number</label>
            <input type="text" id="roll-number" required>

            <label for="casual-leave">Initial Casual Leave</label>
            <input type="number" id="casual-leave" min="0" value="10" required>

            <label for="medical-leave">Initial Medical Leave</label>
            <input type="number" id="medical-leave" min="0" value="10" required>

            <button type="submit">Register</button>
        </form>

        <p>Already registered?
            <button type="button" class="link-btn" id="show-login">Login</button>
        </p>
        <div id="registration-response" class="message"></div>
    </section>

    <!-- Login -->
    <section id="login-section" class="card">
        <h2>Login</h2>

        <form id="login-form">
            <label for="email">Email</label>
            <input type="email" id="email" required>

            <button type="submit">Login</button>
        </form>

        <p>New user?
            <button type="button" class="link-btn" id="show-registration">Create User</button>
        </p>
        <div id="response-message" class="message"></div>
    </section>

    <!-- Dashboard -->
    <section id="dashboard-section" class="card" style="display:none">
        <h2>Welcome, <span id="username-display"></span></h2>
        <p>Roll Number: <span id="roll-number-display"></span></p>

        <h3>Leave Balance</h3>
        <p>Casual Leave: <span id="casual-leave-display">0</span> days</p>
        <p>Medical Leave: <span id="medical-leave-display">0</span> days</p>

        <button type="button" id="refresh-balance" class="small-btn">
            Refresh Balance
        </button>

        <h3>Apply for Leave</h3>
        <form id="leave-form">
            <label for="leave-type">Leave Type</label>
            <select id="leave-type" required>
                <option value="casual">Casual Leave</option>
                <option value="medical">Medical Leave</option>
            </select>

            <label for="leave-days">Number of Days</label>
            <input type="number" id="leave-days" min="1" required>

            <button type="submit">Apply Leave</button>
        </form>

        <div id="dashboard-message" class="message"></div>

        <button type="button" id="logout-button" class="logout-btn">
            Logout
        </button>
    </section>

    <script src="app.js"></script>
</body>
</html>
